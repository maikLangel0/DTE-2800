<!DOCTYPE html>
<head>
    <header>Sandbox main</header>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script id="base-vert-shader" type="x-shader/x-vertex">#version 300 es
        in vec3 aVertexPosition;

        uniform mat4 uModelMatrix;
        uniform mat4 uViewMatrix;
        uniform mat4 uProjectionMatrix;

        void main(void) {
            gl_Position = uProjectionMatrix * uViewMatrix * uModelMatrix * vec4(aVertexPosition, 1.0);
        }
    </script>

    <script id="base-frag-shader" type="x-shader/x-vertex">#version 300 es
        precision mediump float;

        uniform lowp vec4 vColor;
        
        out lowp vec4 fragColor;

        void main(void) {
            fragColor = vColor;
        }

    </script>

    <script type="module">
    'use strict';
    import {main} from "./allshapes.js";
    main();
    </script>
</body>
