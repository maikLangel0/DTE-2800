<!DOCTYPE html>
<head>
    <header>Sandbox main</header>
</head>
<body>
    <canvas id="canvas"></canvas>
    <p id="fps"></p>

    <script id="base-vert-shader" type="x-shader/x-vertex">#version 300 es
        in vec3 aVertexPosition;
        in vec4 aVertexColor;

        uniform mat4 uModelViewMatrix;
        uniform mat4 uProjectionMatrix;

        out mediump vec4 vColor;

        void main(void) {
            gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aVertexPosition, 1.0);
            vColor = aVertexColor;
        }
    </script>

    <script id="base-frag-shader" type="x-shader/x-vertex">#version 300 es
        precision mediump float;

        in mediump vec4 vColor;
        out mediump vec4 fragColor;

        void main(void) {
            fragColor = vColor;
        }

    </script>

    <script id="texture-vert-shader" type="x-shader/x-vertex">#version 300 es
      in vec3 aVertexPosition;
      in vec2 aVertexTextureCoord;

      uniform mat4 uModelViewMatrix;
      uniform mat4 uProjectionMatrix;

      out highp vec2 vTextureCoord;

      void main() {
        gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aVertexPosition, 1.0);
        vTextureCoord = aVertexTextureCoord;

        gl_PointSize = 10.0;
      }
    </script>

    <script id="texture-frag-shader" type="x-shader/x-fragment">#version 300 es
      precision highp float;

      in highp vec2 vTextureCoord;

      uniform sampler2D uSampler0;
      uniform sampler2D uSampler1;
      uniform mediump vec4 uColor;

      out highp vec4 fragColor;

      void main() {
        vec4 texColor = texture(uSampler0, vTextureCoord) * texture(uSampler1, vTextureCoord);
        fragColor = texColor;
      }
    </script>

    <script type="module">
    'use strict';
    import {main} from "./allShapesTexture.js";
    main();
    </script>
</body>
